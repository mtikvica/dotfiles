# ============================================
# Terminal & Color Support
# ============================================
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"

# ============================================
# Mouse Support
# ============================================
set -g mouse on

# ============================================
# Prefix Key (Ctrl+Space)
# ============================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ============================================
# Window & Pane Numbering
# ============================================
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ============================================
# Pane Navigation
# ============================================
# Vim style pane selection (with prefix)
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Alt-arrow keys without prefix to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ============================================
# Window Navigation
# ============================================
# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# ============================================
# Pane Splitting
# ============================================
# Split in current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Alternative splits with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ============================================
# Vi Mode & Copy Mode
# ============================================
set-window-option -g mode-keys vi

# Vi-style copy mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================
# Utility Bindings
# ============================================
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# Performance & Behavior
# ============================================
# Increase scrollback buffer
set -g history-limit 50000

# No delay for escape key (important for vim)
set -sg escape-time 0

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity off

# Increase display time for messages
set -g display-time 2000

# ============================================
# Theme & Plugins
# ============================================
set -g @catppuccin_flavour 'mocha'

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
